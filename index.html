<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Neon Roll 3D</title>
    <!-- CrazyGames SDK — tự no-op khi chạy ngoài platform (dev fallback trong main.ts) -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div id="vignette"></div>

      <div id="hud" class="hidden">
        <div id="hud-top">
          <div id="hud-left">
            <div id="gravChip">
              <span id="gravArrow">&#9650;</span>
              <span id="gravLabel">TOP</span>
            </div>
            <div id="gemChip">&#128142; <span id="gemCount">0</span></div>
          </div>
          <div id="hud-center">
            <div id="score">0</div>
            <div id="speedbar"><div id="speedfill"></div></div>
            <div id="speed">0 km/h</div>
          </div>
          <div id="hud-right">
            <button id="soundBtn" class="iconbtn" title="Sound">&#128266;</button>
            <button id="pauseBtn" class="iconbtn" title="Pause (P)">&#10074;&#10074;</button>
          </div>
        </div>
        <div id="powers">
          <div id="pShield" class="pchip hidden"><span>&#128737;&#65039;</span></div>
          <div id="pSlow" class="pchip hidden"><span>&#9200;</span><div class="pbar"><i id="pSlowBar"></i></div></div>
          <div id="pX2" class="pchip gold hidden"><span>&#10006;2</span><div class="pbar"><i id="pX2Bar"></i></div></div>
          <div id="pGhost" class="pchip purple hidden"><span>&#128123;</span><div class="pbar"><i id="pGhostBar"></i></div></div>
        </div>
        <div id="toast" class="hidden"></div>
        <div id="go" class="hidden">GO!</div>
      </div>

      <div id="menu" class="overlay">
        <button id="soundBtnMenu" class="iconbtn corner" title="Sound">&#128266;</button>
        <button id="fxBtn" class="iconbtn corner corner-2" title="Glow FX (t&#7855;t n&#7871;u m&#225;y y&#7871;u)">&#10024;</button>
        <h1>NEON<span>ROLL</span></h1>
        <p class="sub">Roll fast. Dodge red. Purple gate flips gravity.</p>
        <div class="howto">
          <span class="key">A</span><span class="key">D</span>
          <span class="or">or</span>
          <span class="key">&larr;</span><span class="key">&rarr;</span>
          <span class="or">&middot; tap left / right on mobile</span>
        </div>
        <div class="skin-picker">
          <button id="skinPrev" class="iconbtn">&#9664;</button>
          <div class="skin-info">
            <div id="skinName">NEON CORE</div>
            <div id="skinLock" class="skin-lock">SELECTED</div>
          </div>
          <button id="skinNext" class="iconbtn">&#9654;</button>
        </div>
        <button id="playBtn" class="btn">PLAY</button>
        <button id="mapBtn" class="btn btn-secondary">&#128506; MAPS</button>
        <button id="shopBtn" class="btn btn-secondary">&#128717; SHOP &middot; <span id="walletMenu">0</span> &#128142;</button>
        <p id="bestMenu" class="best"></p>
        <p id="statsMenu" class="stats-line"></p>
      </div>

      <div id="shop" class="overlay shop hidden">
        <div class="shop-head">
          <h3>SHOP</h3>
          <div class="wallet">&#128142; <span id="walletShop">0</span></div>
          <button id="shopClose" class="iconbtn">&#10005;</button>
        </div>
        <div id="shopGrid" class="shop-grid"></div>
      </div>

      <div id="maps" class="overlay shop hidden">
        <div class="shop-head">
          <h3>MAPS</h3>
          <div class="wallet">LV.<span id="lvMenu">1</span></div>
          <button id="mapsClose" class="iconbtn">&#10005;</button>
        </div>
        <p class="hint">M&#7903; kh&#243;a level m&#7899;i b&#7857;ng t&#7893;ng qu&#227;ng &#273;&#432;&#7901;ng &#273;&#227; l&#259;n</p>
        <div id="mapsGrid" class="shop-grid"></div>
      </div>

      <div id="pause" class="overlay hidden">
        <h2 class="pause-title">PAUSED</h2>
        <button id="resumeBtn" class="btn">RESUME</button>
        <button id="pauseRestartBtn" class="btn btn-secondary">RESTART</button>
        <button id="pauseMenuBtn" class="btn btn-secondary">MENU</button>
      </div>

      <div id="over" class="overlay hidden">
        <h2>CRASHED</h2>
        <div id="newBest" class="newbest hidden">&#9733; NEW BEST &#9733;</div>
        <div id="unlockMsg" class="newbest hidden"></div>
        <p id="finalScore" class="final">0m</p>
        <div class="stats-grid">
          <div class="stat"><div class="stat-v" id="statSpeed">0</div><div class="stat-k">TOP KM/H</div></div>
          <div class="stat"><div class="stat-v" id="statFlips">0</div><div class="stat-k">FLIPS</div></div>
          <div class="stat"><div class="stat-v" id="statBest">0</div><div class="stat-k">BEST M</div></div>
        </div>
        <button id="reviveBtn" class="btn btn-revive hidden">&#9654; REVIVE <span class="ad-tag">AD</span></button>
        <button id="retryBtn" class="btn">RETRY</button>
        <button id="menuBtn" class="btn btn-secondary">MENU</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
